  <style>
    /* Self-contained: this page is served for any missing URL, at any depth. */
    :root {
      --bg: #0a0e14;
      --text: #aab6c7;
      --muted: #6f7d92;
      --heading: #d9dde3;
      --border: #222c3c;
      --surface: #111722;
      --accent: #2dd4bf;
      --star: #8f96a3;
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg: #f5f7fb;
      --text: #465366;
      --muted: #74819a;
      --heading: #2a3140;
      --border: #d9e0ea;
      --surface: #ffffff;
      --accent: #0d9488;
      --star: #9aa3b2;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      overflow-x: hidden;
    }

    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    /* ---- the scene ---- */
    .space {
      position: relative;
      width: 300px;
      height: 240px;
      margin: 0 auto 28px;
    }

    .space svg {
      display: block;
      shape-rendering: crispEdges;
    }

    .moon {
      position: absolute;
      left: 50%;
      top: 50%;
      margin: -84px 0 0 -84px;
      z-index: 2;
    }

    /* Orbit: x and y swing a quarter-turn apart, which traces an ellipse.
       The cat is in front of the moon on the way right, behind it on the way back. */
    .orbit {
      position: absolute;
      left: 50%;
      top: 50%;
      margin: -45px 0 0 -40px;
      animation: orbit-x 5s ease-in-out infinite alternate, orbit-z 10s steps(1) infinite;
    }

    .orbit-y {
      animation: orbit-y 5s ease-in-out -2.5s infinite alternate;
    }

    .cat {
      animation: rock 3s steps(6) infinite alternate;
    }

    @keyframes orbit-x {
      from { transform: translateX(-138px); }
      to { transform: translateX(138px); }
    }

    @keyframes orbit-y {
      from { transform: translateY(-40px); }
      to { transform: translateY(40px); }
    }

    @keyframes orbit-z {
      0% { z-index: 3; }
      50% { z-index: 1; }
    }

    @keyframes rock {
      from { transform: rotate(-14deg); }
      to { transform: rotate(14deg); }
    }

    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--star);
      animation: twinkle 2.4s steps(2) infinite;
    }

    @keyframes twinkle {
      50% { opacity: 0.25; }
    }

    /* ---- the text ---- */
    h1 {
      margin: 0 0 18px;
      font: 400 clamp(44px, 14vw, 72px)/1 "Press Start 2P", "JetBrains Mono", monospace;
      letter-spacing: 0.04em;
      color: var(--heading);
    }

    .lead {
      margin: 0 0 10px;
      font: 400 clamp(11px, 3.2vw, 14px)/1.8 "Press Start 2P", "JetBrains Mono", monospace;
      color: var(--heading);
    }

    .sub {
      margin: 0 0 22px;
      color: var(--muted);
    }

    .log {
      margin: 0 auto 26px;
      padding: 12px 14px;
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      font-size: 12.5px;
      text-align: left;
      overflow-x: auto;
      white-space: pre;
    }

    .log b {
      font-weight: 500;
      color: var(--accent);
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 10px;
      background: var(--accent);
      color: #04201c;
      font: 500 14px "JetBrains Mono", monospace;
      text-decoration: none;
    }

    :root[data-theme="light"] .btn {
      color: #fff;
    }

    .btn:hover {
      filter: brightness(1.1);
    }

    @media (max-width: 380px) {
      .space {
        transform: scale(0.85);
        margin-bottom: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orbit, .orbit-y, .cat, .star {
        animation: none;
      }

      .orbit {
        transform: translate(-118px, -52px);
        z-index: 3;
      }
    }
  </style>
</head>
