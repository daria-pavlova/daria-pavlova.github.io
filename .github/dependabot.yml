# Dependabot opens pull requests when the site's libraries or CI actions have updates.
version: 2
updates:
  # Front-end libraries listed in package.json (copied into assets/vendor by `npm run vendor`)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Font Awesome 6+ renames icons and fonts; move to it deliberately, not by auto-update.
      - dependency-name: "@fortawesome/fontawesome-free"
        update-types: ["version-update:semver-major"]

  # The actions used by the workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
