experience:
  - title: DevOps Engineer
    dates: 09/2022 to 04/2024
    company: Rakuten Payment, Tokyo, Japan
    bullets:
      - Engineered robust GitLab CI/CD pipelines for multiple applications, significantly reducing deployment times and increasing reliability.
      - Implemented blue/green and canary deployment strategies using Istio and HAProxy, enhancing system uptime and minimizing deployment risks.
      - Developed a comprehensive Proof of Concept (POC) for Kong deployment on-premises with Ansible and GCP, providing a scalable solution for API management and improving cost efficiency.
      - Automated critical components of GCP infrastructure and monitoring with Terraform, leading to an increase in operational efficiency and resource management.
      - Scripted advanced RBAC and IAM role management for GCP GKE, improving security and access control across the organization.
      - Authored extensive documentation on infrastructure, manual testing, step-by-step reproduction processes, and pipelines, ensuring knowledge transfer and facilitating team collaboration.
  - title: DevOps Engineer
    dates: 05/2021 to 07/2022
    company: Epam Systems, Kharkiv, Ukraine
    bullets:
      - Orchestrated and optimized CI/CD processes using Kubernetes and Jenkins, significantly enhancing deployment speed and reliability.
      - Authored new scripting stages for Jenkins, boosting automation efficiency.
      - Deployed applications to clusters and managed infrastructure resources with AWS services (EC2, S3, RDS, and VPC), ensuring high availability and scalability.
      - Pioneered multitenancy implementation and GitOps approach with ArgoCD and Keycloak, substantially improving access management and control.
      - Integrated and fine-tuned monitoring tools such as Prometheus, Grafana, Datadog, and the ELK stack (Elasticsearch, Logstash, Kibana), optimizing performance and enabling timely problem resolution.
  - title: Technical Operation Engineer
    dates: 11/2020 to 05/2021
    company: Namecheap, Kharkiv, Ukraine
    bullets:
      - Provided technical expertise and support to internal teams and clients on email-related matters, including configuration, troubleshooting, and best practices.
      - Executed email restoration from backups for users, ensuring minimal downtime and data integrity.
      - Optimized investigation strategies and enhanced debugging processes on CentOS/Ubuntu servers, significantly reducing resolution times.
      - Automated routine tasks using scripting languages (Bash, Python), resulting in increased productivity and consistency.
  - title: SRE (Site Reliability Engineer)
    dates: 07/2019 to 08/2020
    company: Team International, Kharkiv, Ukraine
    bullets:
      - Achieved a high SLA with application issues, significantly improving system reliability and customer satisfaction.
      - Enhanced security posture by managing SSH keys for HaProxy servers, reducing unauthorized access incidents.
      - Maintained a clean and efficient infrastructure through monthly inspections and detailed reports, ensuring optimal performance, compliance, and cost improvement.
      - Deployed and managed Azure resources to support application infrastructure, ensuring scalability and high availability.
